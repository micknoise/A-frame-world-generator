<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>The Edge — Room 6: The Mirror Room</title>
<script src="../libs/aframe/aframe-v1.3.0.min.js"></script>
<script>if(window.AFRAME&&AFRAME.components&&AFRAME.components.grabbable)delete AFRAME.components.grabbable;</script>
<script src="../libs/a-game/a-game.min.js"></script>
<style>
body{margin:0;overflow:hidden}
#msg{position:fixed;bottom:0;left:0;width:100%;z-index:100;background:rgba(4,8,8,.96);border-top:1px solid #104040;padding:28px 44px;box-sizing:border-box;font-family:'Courier New',monospace;opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .3s ease,transform .3s ease;max-height:48vh;overflow-y:auto}
#msg.show{opacity:1;pointer-events:auto;transform:none}
#msg .spk{font-size:.52rem;letter-spacing:.38em;color:#307070;text-transform:uppercase;margin-bottom:14px}
#msg .txt{font-size:.88rem;line-height:2.15;color:#80c0c0;max-width:700px}
#msg .dis{font-size:.52rem;color:#103030;margin-top:18px;letter-spacing:.28em;cursor:pointer;text-transform:uppercase;display:inline-block;border:1px solid #103838;padding:7px 18px;transition:color .2s,border-color .2s}
#msg .dis:hover{color:#80c0c0;border-color:#307070}
#exit{position:fixed;top:22px;right:22px;z-index:100;font-family:'Courier New',monospace;opacity:0;pointer-events:none;transition:opacity .5s ease}
#exit.show{opacity:1;pointer-events:auto}
#exit a{color:#307070;font-size:.6rem;letter-spacing:.28em;text-transform:uppercase;text-decoration:none;border:1px solid #104040;padding:10px 22px;display:block;transition:all .3s}
#exit a:hover{color:#80c0c0;border-color:#307070}
</style>
</head>
<body>
<input type="checkbox" id="save-position-from-vr" hidden aria-hidden="true">
<div id="msg">
  <div class="spk" id="spk"></div>
  <div class="txt" id="txt"></div>
  <div class="dis" onclick="closeMsg()">[ look away ]</div>
</div>
<div id="exit"><a href="room7.html">Enter the divided room &#8594;</a></div>
<a-scene physics="workerUrl: ../libs/a-game/cannonWorker.min.js; gravity: 0 -9.8 0"
         fog="type: exponential; color: #040808; density: 0.04" loading-screen="enabled: false">
  <a-player id="player" locomotion grabbing position="0 0 0"></a-player>
  <a-sky color="#030606"></a-sky>
  <a-entity light="type: ambient; color: #0a1818; intensity: 0.3"></a-entity>
  <a-entity light="type: point; color: #208080; intensity: .2; distance: 5" position="0 3.5 0"
            animation="property: light.intensity; from: .15; to: .28; dur: 2400; easing: easeInOutSine; loop: true; dir: alternate"></a-entity>
  <a-entity light="type: point; color: #104040; intensity: .2; distance: 4" position="-4 3.2 -4"></a-entity>
  <a-entity light="type: point; color: #104040; intensity: .2; distance: 4" position=" 4 3.2 -4"></a-entity>
  <a-entity light="type: point; color: #104040; intensity: .15; distance: 4" position="-4 3.2  4"></a-entity>
  <a-entity light="type: point; color: #104040; intensity: .15; distance: 4" position=" 4 3.2  4"></a-entity>
  <!-- Floor — dark reflective -->
  <a-box floor position="0 -0.05 0" width="11" height="0.1" depth="11"
         material="color: #080c0c; roughness: .12; metalness: .55"></a-box>
  <!-- Ceiling -->
  <a-plane position="0 4 0" rotation="90 0 0" width="11" height="11"
           material="color: #040808; roughness: .08; metalness: .4"></a-plane>
  <!-- Walls -->
  <a-box wall position="-5.5 2 0"  width=".14" height="4" depth="11.3" material="color: #0a1414; roughness: .7"></a-box>
  <a-box wall position=" 5.5 2 0"  width=".14" height="4" depth="11.3" material="color: #0a1414; roughness: .7"></a-box>
  <a-box wall position="0 2 -5.5"  width="11.3" height="4" depth=".14" material="color: #0a1414; roughness: .7"></a-box>
  <a-box wall position="0 2  5.5"  width="11.3" height="4" depth=".14" material="color: #0a1414; roughness: .7"></a-box>
  <!-- MIRROR 1 — front wall (facing player entry) -->
  <a-entity id="mg1" position="0 2 -5.4">
    <!-- Frame -->
    <a-box width="2.5" height="3.2" depth=".05" material="color: #0c1a1a; metalness: .3; roughness: .6"></a-box>
    <!-- Mirror surface -->
    <a-box id="mirror1" grabbable="physics:false; immovable:true;"
           position="0 0 .05" width="2.1" height="2.7" depth=".03"
           material="color: #a0c8c8; metalness: .85; roughness: .08; opacity: .7"
           animation="property: material.opacity; from: .55; to: .75; dur: 3200; easing: easeInOutSine; loop: true; dir: alternate"></a-box>
    <!-- False statement etched in mirror -->
    <a-text value="&#34;A literature review proves you read a lot.&#34;"
            position="0 -1.1 .12" text="color: #206060; width: 2.8; align: center; font: monoid; wrapCount: 28"></a-text>
    <a-entity light="type: point; color: #208080; intensity: .25; distance: 2.5" position="0 1.6 .3"></a-entity>
  </a-entity>
  <!-- MIRROR 2 — right wall -->
  <a-entity id="mg2" position="5.4 2 0" rotation="0 -90 0">
    <a-box width="2.5" height="3.2" depth=".05" material="color: #0c1a1a; metalness: .3; roughness: .6"></a-box>
    <a-box id="mirror2" grabbable="physics:false; immovable:true;"
           position="0 0 .05" width="2.1" height="2.7" depth=".03"
           material="color: #a0c8c8; metalness: .85; roughness: .08; opacity: .7"
           animation="property: material.opacity; from: .5; to: .72; dur: 2800; easing: easeInOutSine; loop: true; dir: alternate"></a-box>
    <a-text value="&#34;The gap is just the last paragraph of the introduction.&#34;"
            position="0 -1.1 .12" text="color: #206060; width: 2.8; align: center; font: monoid; wrapCount: 28"></a-text>
    <a-entity light="type: point; color: #208080; intensity: .25; distance: 2.5" position="0 1.6 .3"></a-entity>
  </a-entity>
  <!-- MIRROR 3 — back wall -->
  <a-entity id="mg3" position="0 2 5.4" rotation="0 180 0">
    <a-box width="2.5" height="3.2" depth=".05" material="color: #0c1a1a; metalness: .3; roughness: .6"></a-box>
    <a-box id="mirror3" grabbable="physics:false; immovable:true;"
           position="0 0 .05" width="2.1" height="2.7" depth=".03"
           material="color: #a0c8c8; metalness: .85; roughness: .08; opacity: .7"
           animation="property: material.opacity; from: .6; to: .78; dur: 3600; easing: easeInOutSine; loop: true; dir: alternate"></a-box>
    <a-text value="&#34;Novel means no one has done it before. That&#39;s enough.&#34;"
            position="0 -1.1 .12" text="color: #206060; width: 2.8; align: center; font: monoid; wrapCount: 28"></a-text>
    <a-entity light="type: point; color: #208080; intensity: .25; distance: 2.5" position="0 1.6 .3"></a-entity>
  </a-entity>
  <!-- MIRROR 4 — left wall -->
  <a-entity id="mg4" position="-5.4 2 0" rotation="0 90 0">
    <a-box width="2.5" height="3.2" depth=".05" material="color: #0c1a1a; metalness: .3; roughness: .6"></a-box>
    <a-box id="mirror4" grabbable="physics:false; immovable:true;"
           position="0 0 .05" width="2.1" height="2.7" depth=".03"
           material="color: #a0c8c8; metalness: .85; roughness: .08; opacity: .7"
           animation="property: material.opacity; from: .52; to: .76; dur: 3000; easing: easeInOutSine; loop: true; dir: alternate"></a-box>
    <a-text value="&#34;You write the lit review after the project is done.&#34;"
            position="0 -1.1 .12" text="color: #206060; width: 2.8; align: center; font: monoid; wrapCount: 28"></a-text>
    <a-entity light="type: point; color: #208080; intensity: .25; distance: 2.5" position="0 1.6 .3"></a-entity>
  </a-entity>
</a-scene>
<script>
var seen = 0;
var total = 4;
var mirrorData = {
  mirror1: ['"A literature review proves you read a lot."', 'False. The review proves you read the right things and understood their relationship to each other and to your question. A list of sources is not a review. An argument about the field — illustrated by sources — is.'],
  mirror2: ['"The gap is just the last paragraph of the introduction."', 'False. The gap is the argument that everything else serves. The introduction narrows towards it. The literature review establishes it. The methodology responds to it. It\'s not a paragraph — it\'s the architecture.'],
  mirror3: ['"Novel means no one has done it before. That\'s enough."', 'False. Novelty is necessary but not sufficient. The question is: why does the absence matter? What have we failed to understand, make, or test because of it? The gap must have stakes, not just coordinates.'],
  mirror4: ['"You write the lit review after the project is done."', 'False. The review shapes the project. It tells you what method to use, what questions are already answered, what your contribution can realistically be. Write it first — even if you revise it later. It is not decoration. It is architecture.']
};
function showMsg(s, t) {
  document.getElementById('spk').textContent = s;
  document.getElementById('txt').textContent = t;
  document.getElementById('msg').classList.add('show');
}
function closeMsg() {
  document.getElementById('msg').classList.remove('show');
  if (seen >= total) document.getElementById('exit').classList.add('show');
}
Object.keys(mirrorData).forEach(function(id) {
  document.getElementById(id).addEventListener('grab', function(e) {
    if (this.dataset.done) { e.detail.grabbing.components.grabbing.drop(); return; }
    this.dataset.done = '1';
    e.detail.grabbing.components.grabbing.drop();
    seen++;
    // Crack the false statement — dim the mirror
    this.setAttribute('animation', 'property: material.opacity; from: .7; to: .2; dur: 1200; easing: easeOutQuad');
    this.setAttribute('material', 'emissive: #ff0000; emissiveIntensity: 0');
    // Get parent mirror group's text and cross it out
    showMsg(mirrorData[id][0], mirrorData[id][1]);
  });
});
</script>
</body>
</html>
