<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>The Edge — Room 2: The Corridor</title>
<script src="../libs/aframe/aframe-v1.3.0.min.js"></script>
<script>if(window.AFRAME&&AFRAME.components&&AFRAME.components.grabbable)delete AFRAME.components.grabbable;</script>
<script src="../libs/a-game/a-game.min.js"></script>
<style>
body{margin:0;overflow:hidden}
#msg{position:fixed;bottom:0;left:0;width:100%;z-index:100;background:rgba(4,4,10,.96);border-top:1px solid #28284a;padding:28px 44px;box-sizing:border-box;font-family:'Courier New',monospace;opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .3s ease,transform .3s ease;max-height:48vh;overflow-y:auto}
#msg.show{opacity:1;pointer-events:auto;transform:none}
#msg .spk{font-size:.52rem;letter-spacing:.38em;color:#484890;text-transform:uppercase;margin-bottom:14px}
#msg .txt{font-size:.88rem;line-height:2.15;color:#9898c4;max-width:700px}
#msg .dis{font-size:.52rem;color:#303060;margin-top:18px;letter-spacing:.28em;cursor:pointer;text-transform:uppercase;display:inline-block;border:1px solid #28284a;padding:7px 18px;transition:color .2s,border-color .2s}
#msg .dis:hover{color:#9898c4;border-color:#484890}
#dec{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:200;background:rgba(4,4,10,.97);border:1px solid #28284a;padding:36px;max-width:570px;width:90%;font-family:'Courier New',monospace;opacity:0;pointer-events:none;transition:opacity .3s ease}
#dec.show{opacity:1;pointer-events:auto}
#dec .q{font-size:.86rem;line-height:2;color:#9898c4;margin-bottom:1.6em}
#dec button{display:block;width:100%;text-align:left;padding:12px 16px;background:transparent;border:1px solid #28284a;color:#9898c4;font-family:'Courier New',monospace;font-size:.76rem;margin-bottom:8px;cursor:pointer;transition:border-color .2s;line-height:1.65}
#dec button:hover{border-color:#484890}
#dec button.cor{border-color:#508050;color:#80c080}
#dec button.wrg{border-color:#805050;color:#c08080}
#dec .fb{font-size:.76rem;line-height:1.85;color:#6868a0;margin-top:1.1em;display:none}
#dec .fb.show{display:block}
#exit{position:fixed;top:22px;right:22px;z-index:100;font-family:'Courier New',monospace;opacity:0;pointer-events:none;transition:opacity .5s ease}
#exit.show{opacity:1;pointer-events:auto}
#exit a{color:#484890;font-size:.6rem;letter-spacing:.28em;text-transform:uppercase;text-decoration:none;border:1px solid #28284a;padding:10px 22px;display:block;transition:all .3s}
#exit a:hover{color:#9898c4;border-color:#484890}
</style>
</head>
<body>
<input type="checkbox" id="save-position-from-vr" hidden aria-hidden="true">
<div id="msg">
  <div class="spk" id="spk"></div>
  <div class="txt" id="txt"></div>
  <div class="dis" onclick="closeMsg()">[ continue ]</div>
</div>
<div id="dec">
  <div class="q" id="dq"></div>
  <div id="dopts"></div>
  <div class="fb" id="dfb"></div>
</div>
<div id="exit"><a href="room3.html">Through the final door →</a></div>
<a-scene physics="workerUrl: ../libs/a-game/cannonWorker.min.js; gravity: 0 -9.8 0"
         fog="type: exponential; color: #04040e; density: 0.028" loading-screen="enabled: false">
  <a-player id="player" locomotion grabbing position="0 0 18"></a-player>
  <a-sky color="#030310"></a-sky>
  <a-entity light="type: ambient; color: #181830; intensity: 0.35"></a-entity>
  <a-entity light="type: point; color: #5858c0; intensity: .45; distance: 7" position="0 3.2 16"></a-entity>
  <a-entity light="type: point; color: #5050b0; intensity: .35; distance: 7" position="0 3.2 10"></a-entity>
  <a-entity light="type: point; color: #4848a0; intensity: .35; distance: 7" position="0 3.2  4"></a-entity>
  <a-entity light="type: point; color: #4040a0; intensity: .35; distance: 7" position="0 3.2 -2"></a-entity>
  <a-entity light="type: point; color: #3838a0; intensity: .3;  distance: 7" position="0 3.2 -8"></a-entity>
  <a-entity light="type: point; color: #3838a0; intensity: .25; distance: 7" position="0 3.2 -14"></a-entity>
  <!-- Floor -->
  <a-box floor position="0 -0.05 0" width="4" height="0.1" depth="42" material="color: #09091a; roughness: .9"></a-box>
  <!-- Ceiling -->
  <a-plane position="0 3.5 0" rotation="90 0 0" width="4" height="42" material="color: #040410"></a-plane>
  <!-- Long corridor walls -->
  <a-box wall position="-2 1.75 0" width="0.14" height="3.5" depth="42" material="color: #0c0c20; roughness: .9"></a-box>
  <a-box wall position=" 2 1.75 0" width="0.14" height="3.5" depth="42" material="color: #0c0c20; roughness: .9"></a-box>
  <!-- End wall -->
  <a-box wall position="0 1.75 -21" width="4" height="3.5" depth="0.14" material="color: #0c0c20"></a-box>
  <!-- Far end text -->
  <a-text value="Every conversation&#10;has a history.&#10;Learn it."
          position="0 1.9 -20.8" rotation="0 0 0"
          text="color: #2828a0; width: 5; align: center; font: monoid"></a-text>
  <a-entity light="type: point; color: #2828a0; intensity: .35; distance: 5" position="0 2.2 -19"></a-entity>
  <!-- Floating instruction (near start) -->
  <a-text value="Walk forward.&#10;Knock on the doors."
          position="0 2.2 16" rotation="0 180 0"
          text="color: #303060; width: 4.5; align: center; font: monoid"></a-text>

  <!-- DOOR 1 — left (z=14) -->
  <a-entity id="d1g" position="-1.94 0 14">
    <a-box width="0.08" height="2.5" depth="1.3" material="color: #14142a"></a-box>
    <a-box id="knob1" grabbable="physics:false; immovable:true;"
           position="0.06 1.25 0" width="0.1" height="0.1" depth="0.1"
           material="color: #5858c0; emissive: #4040a0; emissiveIntensity: .45; metalness: .6"
           animation="property: material.emissiveIntensity; from: .3; to: .65; dur: 2000; easing: easeInOutSine; loop: true; dir: alternate"></a-box>
    <a-text value="KNOCK" position="0.12 1.75 0" rotation="0 90 0"
            text="color: #303060; width: 1.8; align: center; font: monoid" id="lbl1"></a-text>
  </a-entity>

  <!-- DOOR 2 — right (z=8) -->
  <a-entity id="d2g" position="1.94 0 8">
    <a-box width="0.08" height="2.5" depth="1.3" material="color: #14142a"></a-box>
    <a-box id="knob2" grabbable="physics:false; immovable:true;"
           position="-0.06 1.25 0" width="0.1" height="0.1" depth="0.1"
           material="color: #5858c0; emissive: #4040a0; emissiveIntensity: .45; metalness: .6"
           animation="property: material.emissiveIntensity; from: .3; to: .65; dur: 2200; easing: easeInOutSine; loop: true; dir: alternate"></a-box>
    <a-text value="KNOCK" position="-0.12 1.75 0" rotation="0 -90 0"
            text="color: #303060; width: 1.8; align: center; font: monoid" id="lbl2"></a-text>
  </a-entity>

  <!-- DOOR 3 — left (z=2) -->
  <a-entity id="d3g" position="-1.94 0 2">
    <a-box width="0.08" height="2.5" depth="1.3" material="color: #14142a"></a-box>
    <a-box id="knob3" grabbable="physics:false; immovable:true;"
           position="0.06 1.25 0" width="0.1" height="0.1" depth="0.1"
           material="color: #5858c0; emissive: #4040a0; emissiveIntensity: .45; metalness: .6"
           animation="property: material.emissiveIntensity; from: .3; to: .65; dur: 1800; easing: easeInOutSine; loop: true; dir: alternate"></a-box>
    <a-text value="KNOCK" position="0.12 1.75 0" rotation="0 90 0"
            text="color: #303060; width: 1.8; align: center; font: monoid" id="lbl3"></a-text>
  </a-entity>

  <!-- DOOR 4 — right (z=-4) — ominous -->
  <a-entity id="d4g" position="1.94 0 -4">
    <a-box width="0.08" height="2.5" depth="1.3" material="color: #1e0a1a"></a-box>
    <a-box id="knob4" grabbable="physics:false; immovable:true;"
           position="-0.06 1.25 0" width="0.1" height="0.1" depth="0.1"
           material="color: #a03880; emissive: #802060; emissiveIntensity: .5; metalness: .6"
           animation="property: material.emissiveIntensity; from: .35; to: .75; dur: 1500; easing: easeInOutSine; loop: true; dir: alternate"></a-box>
    <a-text value="KNOCK" position="-0.12 1.75 0" rotation="0 -90 0"
            text="color: #504050; width: 1.8; align: center; font: monoid" id="lbl4"></a-text>
    <a-entity light="type: point; color: #a03880; intensity: .25; distance: 3.5" position="-0.5 1.5 0"></a-entity>
  </a-entity>
</a-scene>
<script>
var knocked = 0;
function showMsg(s,t){document.getElementById('spk').textContent=s;document.getElementById('txt').textContent=t;document.getElementById('msg').classList.add('show')}
function closeMsg(){document.getElementById('msg').classList.remove('show')}

function hideLabel(n){var l=document.getElementById('lbl'+n);if(l)l.setAttribute('visible','false')}

function showDecision(){
  document.getElementById('dq').textContent='A student says their project is interdisciplinary, so it doesn't fit any field. What's the problem with this claim?';
  var opts=document.getElementById('dopts');opts.innerHTML='';
  var cs=[
    {t:'They're right — truly original work transcends fields.',c:false},
    {t:'Interdisciplinary work sits at the intersection of multiple fields. You still need to know those fields. Being between them isn't the same as being outside them.',c:true},
    {t:'They should pick one field and commit to it.',c:false}
  ];
  cs.forEach(function(o){
    var b=document.createElement('button');b.textContent=o.t;
    if(o.c)b.dataset.correct='true';
    b.onclick=function(){
      var all=opts.querySelectorAll('button');all.forEach(function(x){x.style.pointerEvents='none'});
      b.classList.add(o.c?'cor':'wrg');
      if(!o.c)all.forEach(function(x){if(x.dataset.correct)x.classList.add('cor')});
      var fb=document.getElementById('dfb');
      fb.textContent=o.c?'Correct. Interdisciplinarity is harder, not easier. You have to read in multiple directions. The intersection is where the work lives — not the void.':'Not quite. Interdisciplinary work sits between fields, not outside them. You still need to know the conversations in each. It's harder, not easier.';
      fb.classList.add('show');
      setTimeout(function(){document.getElementById('dec').classList.remove('show');document.getElementById('exit').classList.add('show')},4000);
    };
    opts.appendChild(b);
  });
  document.getElementById('dec').classList.add('show');
}

['knob1','knob2','knob3','knob4'].forEach(function(id,i){
  document.getElementById(id).addEventListener('grab',function(e){
    if(this.dataset.done){e.detail.grabbing.components.grabbing.drop();return}
    this.dataset.done='1';
    e.detail.grabbing.components.grabbing.drop();
    knocked++;
    hideLabel(i+1);
    var msgs=[
      ['Voice behind the door','A field is not a topic. It is not a discipline. It is the community of people working on related problems, and the body of work they have produced. It is a living, ongoing conversation.'],
      ['Voice behind the door','In creative computing, your field is almost never a single discipline. It might include a technical literature, an artistic lineage, a critical discourse, and a design community. You don't need to master all of these — but you need to know which ones matter for your project.'],
      ['Voice behind the door','You wouldn't walk into a room full of people discussing something, ignore everything they've said, and start talking about your own thing. That's what a project without context looks like. A literature review is proof that you've been listening.'],
      null
    ];
    if(msgs[i])showMsg(msgs[i][0],msgs[i][1]);
    else showDecision();
  });
});
</script>
</body>
</html>
