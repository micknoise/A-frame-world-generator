<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Room 4 — The Gallery of Absences</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    #msgbox {
      position: fixed; bottom: 0; left: 0; width: 100%; z-index: 100;
      background: rgba(5,5,8,0.94); border-top: 1px solid #252535;
      padding: 24px 32px; box-sizing: border-box;
      font-family: 'Courier New', monospace; color: #b0b0cc;
      display: none; max-height: 45vh; overflow-y: auto;
    }
    #msgbox.show { display: block; }
    #msgbox .speaker { font-size: 0.65rem; letter-spacing: 0.2em; color: #6060a0; text-transform: uppercase; margin-bottom: 8px; }
    #msgbox .text { font-size: 0.85rem; line-height: 1.8; }
    #msgbox .dismiss { font-size: 0.65rem; color: #404060; margin-top: 12px; letter-spacing: 0.15em; cursor: pointer; }
    #msgbox .dismiss:hover { color: #b0b0cc; }

    #counter {
      position: fixed; top: 20px; left: 20px; z-index: 100;
      font-family: 'Courier New', monospace; font-size: 0.7rem;
      color: #404060; letter-spacing: 0.15em; pointer-events: none;
    }

    #door-prompt {
      position: fixed; top: 20px; right: 20px; z-index: 100;
      font-family: 'Courier New', monospace; display: none;
    }
    #door-prompt.show { display: block; }
    #door-prompt a {
      color: #6060a0; font-size: 0.75rem; letter-spacing: 0.15em;
      text-decoration: none; border: 1px solid #252535; padding: 10px 20px;
      transition: all 0.3s;
    }
    #door-prompt a:hover { color: #b0b0cc; border-color: #6060a0; }

    #riddle-box {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 200; background: rgba(5,5,8,0.96); border: 1px solid #252535;
      padding: 32px; max-width: 580px; width: 90%;
      font-family: 'Courier New', monospace; color: #b0b0cc; display: none;
    }
    #riddle-box.show { display: block; }
    #riddle-box .q { font-size: 0.9rem; line-height: 1.8; margin-bottom: 1.5em; }
    #riddle-box button {
      display: block; width: 100%; text-align: left; padding: 12px 16px;
      background: transparent; border: 1px solid #252535; color: #b0b0cc;
      font-family: 'Courier New', monospace; font-size: 0.8rem; margin-bottom: 8px;
      cursor: pointer; transition: all 0.3s; line-height: 1.5;
    }
    #riddle-box button:hover { border-color: #6060a0; background: #0a0a14; }
    #riddle-box button.correct { border-color: #508050; color: #80c080; }
    #riddle-box button.wrong { border-color: #805050; color: #c08080; }
    #riddle-box .feedback { font-size: 0.8rem; line-height: 1.7; color: #7070a0; margin-top: 1em; display: none; }
    #riddle-box .feedback.show { display: block; }
  </style>
</head>
<body>

<div id="counter">Absences examined: <span id="count">0</span> / 6</div>

<div id="msgbox">
  <div class="speaker" id="msg-speaker"></div>
  <div class="text" id="msg-text"></div>
  <div class="dismiss" onclick="closeMsg()">[ continue ]</div>
</div>

<div id="riddle-box">
  <div class="q" id="riddle-q"></div>
  <div id="riddle-opts"></div>
  <div class="feedback" id="riddle-fb"></div>
</div>

<div id="door-prompt">
  <a href="room5.html">Exit the gallery →</a>
</div>

<a-scene fog="type: exponential; color: #050508; density: 0.025">
  <a-sky color="#050508"></a-sky>
  <a-entity light="type: ambient; color: #151520; intensity: 0.3"></a-entity>

  <!-- Camera -->
  <a-entity position="0 1.6 8">
    <a-entity camera look-controls wasd-controls="acceleration: 20">
      <a-entity cursor="fuse: false"
                position="0 0 -1"
                geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.018"
                material="color: #8080c0; shader: flat; opacity: 0.5"
                raycaster="objects: .clickable; far: 15"></a-entity>
    </a-entity>
  </a-entity>

  <!-- Floor — polished dark -->
  <a-plane position="0 0 0" rotation="-90 0 0" width="16" height="22"
           material="color: #08080c; roughness: 0.3; metalness: 0.2"></a-plane>

  <!-- High ceiling -->
  <a-plane position="0 6 0" rotation="90 0 0" width="16" height="22"
           material="color: #030306"></a-plane>

  <!-- Gallery title -->
  <a-text value="THE GALLERY OF ABSENCES" position="0 4.5 -9"
          text="color: #303050; width: 10; align: center; font: monoid; letterSpacing: 8"></a-text>

  <!-- Subtitle -->
  <a-text value="Six types of gap. Six shapes of what's missing." position="0 3.8 -9"
          text="color: #252540; width: 7; align: center; font: monoid"></a-text>

  <!-- === PEDESTAL 1: Method Gap — left front === -->
  <a-entity position="-4 0 4">
    <a-cylinder height="1" radius="0.4" material="color: #1a1a24; roughness: 0.6"></a-cylinder>
    <!-- Empty glass case -->
    <a-box width="0.6" height="0.8" depth="0.6" position="0 0.9 0"
           material="color: #4040a0; opacity: 0.08; transparent: true; side: double"></a-box>
    <a-box class="clickable" id="gap1" width="0.7" height="1" depth="0.7" position="0 0.9 0"
           material="opacity: 0; transparent: true"></a-box>
    <a-entity light="type: spot; color: #6060c0; intensity: 0.5; angle: 30; distance: 4" position="0 3 0" rotation="-90 0 0"></a-entity>
    <a-text value="METHOD" position="0 0.15 0.45" text="color: #4040a0; width: 1.5; align: center; font: monoid"></a-text>
  </a-entity>

  <!-- === PEDESTAL 2: Application Gap — right front === -->
  <a-entity position="4 0 4">
    <a-cylinder height="1" radius="0.4" material="color: #1a1a24; roughness: 0.6"></a-cylinder>
    <a-box width="0.6" height="0.8" depth="0.6" position="0 0.9 0"
           material="color: #40a060; opacity: 0.08; transparent: true; side: double"></a-box>
    <a-box class="clickable" id="gap2" width="0.7" height="1" depth="0.7" position="0 0.9 0"
           material="opacity: 0; transparent: true"></a-box>
    <a-entity light="type: spot; color: #40a060; intensity: 0.5; angle: 30; distance: 4" position="0 3 0" rotation="-90 0 0"></a-entity>
    <a-text value="APPLICATION" position="0 0.15 0.45" text="color: #308050; width: 1.5; align: center; font: monoid"></a-text>
  </a-entity>

  <!-- === PEDESTAL 3: Knowledge Gap — left middle === -->
  <a-entity position="-4 0 -1">
    <a-cylinder height="1" radius="0.4" material="color: #1a1a24; roughness: 0.6"></a-cylinder>
    <a-box width="0.6" height="0.8" depth="0.6" position="0 0.9 0"
           material="color: #a0a040; opacity: 0.08; transparent: true; side: double"></a-box>
    <a-box class="clickable" id="gap3" width="0.7" height="1" depth="0.7" position="0 0.9 0"
           material="opacity: 0; transparent: true"></a-box>
    <a-entity light="type: spot; color: #a0a040; intensity: 0.5; angle: 30; distance: 4" position="0 3 0" rotation="-90 0 0"></a-entity>
    <a-text value="KNOWLEDGE" position="0 0.15 0.45" text="color: #808030; width: 1.5; align: center; font: monoid"></a-text>
  </a-entity>

  <!-- === PEDESTAL 4: Scale Gap — right middle === -->
  <a-entity position="4 0 -1">
    <a-cylinder height="1" radius="0.4" material="color: #1a1a24; roughness: 0.6"></a-cylinder>
    <a-box width="0.6" height="0.8" depth="0.6" position="0 0.9 0"
           material="color: #a06040; opacity: 0.08; transparent: true; side: double"></a-box>
    <a-box class="clickable" id="gap4" width="0.7" height="1" depth="0.7" position="0 0.9 0"
           material="opacity: 0; transparent: true"></a-box>
    <a-entity light="type: spot; color: #a06040; intensity: 0.5; angle: 30; distance: 4" position="0 3 0" rotation="-90 0 0"></a-entity>
    <a-text value="SCALE" position="0 0.15 0.45" text="color: #805030; width: 1.5; align: center; font: monoid"></a-text>
  </a-entity>

  <!-- === PEDESTAL 5: Critical Gap — left back === -->
  <a-entity position="-4 0 -6">
    <a-cylinder height="1" radius="0.4" material="color: #1a1a24; roughness: 0.6"></a-cylinder>
    <a-box width="0.6" height="0.8" depth="0.6" position="0 0.9 0"
           material="color: #a04060; opacity: 0.08; transparent: true; side: double"></a-box>
    <a-box class="clickable" id="gap5" width="0.7" height="1" depth="0.7" position="0 0.9 0"
           material="opacity: 0; transparent: true"></a-box>
    <a-entity light="type: spot; color: #a04060; intensity: 0.5; angle: 30; distance: 4" position="0 3 0" rotation="-90 0 0"></a-entity>
    <a-text value="CRITICAL" position="0 0.15 0.45" text="color: #803050; width: 1.5; align: center; font: monoid"></a-text>
  </a-entity>

  <!-- === PEDESTAL 6: Audience Gap — right back === -->
  <a-entity position="4 0 -6">
    <a-cylinder height="1" radius="0.4" material="color: #1a1a24; roughness: 0.6"></a-cylinder>
    <a-box width="0.6" height="0.8" depth="0.6" position="0 0.9 0"
           material="color: #6040a0; opacity: 0.08; transparent: true; side: double"></a-box>
    <a-box class="clickable" id="gap6" width="0.7" height="1" depth="0.7" position="0 0.9 0"
           material="opacity: 0; transparent: true"></a-box>
    <a-entity light="type: spot; color: #6040a0; intensity: 0.5; angle: 30; distance: 4" position="0 3 0" rotation="-90 0 0"></a-entity>
    <a-text value="AUDIENCE" position="0 0.15 0.45" text="color: #503080; width: 1.5; align: center; font: monoid"></a-text>
  </a-entity>

</a-scene>

<script>
var found = 0;
var gapData = {
  gap1: { title: 'Method Gap', text: 'A known problem that hasn\'t been approached with this technique. Example: nobody has used diffusion models for live performance audio — they\'ve only been used for offline generation. The problem is known. The tool exists. They haven\'t been combined.' },
  gap2: { title: 'Application Gap', text: 'A technique that hasn\'t been applied in this domain. Example: reinforcement learning is well studied in games but rarely applied to choreographic composition. The method works elsewhere — what happens when you bring it here?' },
  gap3: { title: 'Knowledge Gap', text: 'Something we don\'t yet know or understand. Example: we don\'t know how audiences perceive AI-generated music differently from human-composed music. The question is open. Nobody has answered it.' },
  gap4: { title: 'Scale Gap', text: 'Something that works at one scale but hasn\'t been tested at another. A technique proven on small datasets but never tried at production scale. A prototype that works for one user — what about a hundred?' },
  gap5: { title: 'Critical Gap', text: 'A framing or assumption that hasn\'t been questioned. Example: most work on generative art assumes a single author — what happens when authorship is distributed? An orthodoxy hiding in plain sight.' },
  gap6: { title: 'Audience Gap', text: 'Work that exists for one community but hasn\'t reached another. Knowledge trapped in one discipline that another discipline needs. A bridge not yet built.' }
};

function showMsg(speaker, text) {
  document.getElementById('msg-speaker').textContent = speaker;
  document.getElementById('msg-text').textContent = text;
  document.getElementById('msgbox').classList.add('show');
}

function closeMsg() {
  document.getElementById('msgbox').classList.remove('show');
  if (found >= 6) {
    showRiddle();
  }
}

Object.keys(gapData).forEach(function(id) {
  document.getElementById(id).addEventListener('interact', function() {
    if (this.dataset.done) return; this.dataset.done = '1';
    found++;
    document.getElementById('count').textContent = found;
    var d = gapData[id];
    showMsg(d.title, d.text);
  });
});

function showRiddle() {
  var box = document.getElementById('riddle-box');
  document.getElementById('riddle-q').textContent = 'You\'ve examined all six absences. Now: "Nobody has used diffusion models for live performance audio — they\'ve only been used offline." What type of gap is this?';
  var opts = document.getElementById('riddle-opts');
  opts.innerHTML = '';

  var choices = [
    { text: 'A knowledge gap — we don\'t understand something yet.', correct: false },
    { text: 'A method gap — a known problem, an existing technique, not yet combined.', correct: true },
    { text: 'An audience gap — the work hasn\'t reached the right people.', correct: false },
    { text: 'A scale gap — it works at one scale but not another.', correct: false }
  ];

  choices.forEach(function(c) {
    var btn = document.createElement('button');
    btn.textContent = c.text;
    btn.onclick = function() {
      var all = opts.querySelectorAll('button');
      all.forEach(function(b) { b.style.pointerEvents = 'none'; });
      if (c.correct) {
        btn.classList.add('correct');
        document.getElementById('riddle-fb').textContent = 'Correct. The problem is known (live audio). The technique exists (diffusion models). Nobody has combined them. That\'s a method gap — the opening is in the approach.';
      } else {
        btn.classList.add('wrong');
        choices.forEach(function(ch, i) { if (ch.correct) all[i].classList.add('correct'); });
        document.getElementById('riddle-fb').textContent = 'This is a method gap. The problem (live audio generation) and the technique (diffusion models) both exist — they just haven\'t been combined. The gap is in the approach.';
      }
      document.getElementById('riddle-fb').classList.add('show');
      setTimeout(function() {
        box.classList.remove('show');
        document.getElementById('door-prompt').classList.add('show');
      }, 4000);
    };
    opts.appendChild(btn);
  });

  box.classList.add('show');
}

document.addEventListener('keydown', function(e) {
  if (e.key !== 'e' && e.key !== 'E') return;
  var cursorEl = document.querySelector('[raycaster]');
  if (!cursorEl) return;
  var raycaster = cursorEl.components.raycaster;
  if (!raycaster) return;
  var els = raycaster.intersectedEls;
  if (!els || !els.length) return;
  els[0].emit('interact');
});
</script>
</body>
</html>
