<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>The Edge — Room 4: The Gallery of Absences</title>
<script src="../libs/aframe/aframe-v1.3.0.min.js"></script>
<script>if(window.AFRAME&&AFRAME.components&&AFRAME.components.grabbable)delete AFRAME.components.grabbable;</script>
<script src="../libs/a-game/a-game.min.js"></script>
<style>
body{margin:0;overflow:hidden}
#msg{position:fixed;bottom:0;left:0;width:100%;z-index:100;background:rgba(3,3,8,.96);border-top:1px solid #202048;padding:28px 44px;box-sizing:border-box;font-family:'Courier New',monospace;opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .3s ease,transform .3s ease;max-height:48vh;overflow-y:auto}
#msg.show{opacity:1;pointer-events:auto;transform:none}
#msg .spk{font-size:.52rem;letter-spacing:.38em;color:#404090;text-transform:uppercase;margin-bottom:14px}
#msg .txt{font-size:.88rem;line-height:2.15;color:#9898cc;max-width:700px}
#msg .dis{font-size:.52rem;color:#28284a;margin-top:18px;letter-spacing:.28em;cursor:pointer;text-transform:uppercase;display:inline-block;border:1px solid #202040;padding:7px 18px;transition:color .2s,border-color .2s}
#msg .dis:hover{color:#9898cc;border-color:#404090}
#dec{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:200;background:rgba(3,3,8,.97);border:1px solid #202048;padding:36px;max-width:580px;width:92%;font-family:'Courier New',monospace;opacity:0;pointer-events:none;transition:opacity .3s ease}
#dec.show{opacity:1;pointer-events:auto}
#dec .q{font-size:.86rem;line-height:2;color:#9898cc;margin-bottom:1.6em}
#dec button{display:block;width:100%;text-align:left;padding:12px 16px;background:transparent;border:1px solid #202048;color:#9898cc;font-family:'Courier New',monospace;font-size:.76rem;margin-bottom:8px;cursor:pointer;transition:border-color .2s;line-height:1.65}
#dec button:hover{border-color:#404090}
#dec button.cor{border-color:#508050;color:#80c080}
#dec button.wrg{border-color:#805050;color:#c08080}
#dec .fb{font-size:.76rem;line-height:1.85;color:#606098;margin-top:1.1em;display:none}
#dec .fb.show{display:block}
#counter{position:fixed;top:22px;left:22px;z-index:100;font-family:'Courier New',monospace;font-size:.6rem;letter-spacing:.22em;color:#2a2a50;transition:color .4s}
#counter.lit{color:#8888b8}
#exit{position:fixed;top:22px;right:22px;z-index:100;font-family:'Courier New',monospace;opacity:0;pointer-events:none;transition:opacity .5s ease}
#exit.show{opacity:1;pointer-events:auto}
#exit a{color:#404090;font-size:.6rem;letter-spacing:.28em;text-transform:uppercase;text-decoration:none;border:1px solid #202048;padding:10px 22px;display:block;transition:all .3s}
#exit a:hover{color:#9898cc;border-color:#404090}
</style>
</head>
<body>
<input type="checkbox" id="save-position-from-vr" hidden aria-hidden="true">
<div id="counter">Absences examined: 0 / 6</div>
<div id="msg">
  <div class="spk" id="spk"></div>
  <div class="txt" id="txt"></div>
  <div class="dis" onclick="closeMsg()">[ continue ]</div>
</div>
<div id="dec">
  <div class="q" id="dq"></div>
  <div id="dopts"></div>
  <div class="fb" id="dfb"></div>
</div>
<div id="exit"><a href="room5.html">Exit the gallery &#8594;</a></div>
<a-scene physics="workerUrl: ../libs/a-game/cannonWorker.min.js; gravity: 0 -9.8 0"
         fog="type: exponential; color: #030306; density: 0.022" loading-screen="enabled: false">
  <a-player id="player" locomotion grabbing position="0 0 8"></a-player>
  <a-sky color="#020204"></a-sky>
  <a-entity light="type: ambient; color: #0a0a18; intensity: 0.25"></a-entity>
  <!-- Floor -->
  <a-box floor position="0 -0.05 0" width="22" height="0.1" depth="18" material="color: #050508; roughness: .95"></a-box>
  <!-- Ceiling -->
  <a-plane position="0 4.5 0" rotation="90 0 0" width="22" height="18" material="color: #020204"></a-plane>
  <!-- Walls -->
  <a-box wall position="-11 2.25 0" width=".14" height="4.5" depth="18.3" material="color: #080810; roughness: .9"></a-box>
  <a-box wall position=" 11 2.25 0" width=".14" height="4.5" depth="18.3" material="color: #080810; roughness: .9"></a-box>
  <a-box wall position="0 2.25 -9"  width="22.3" height="4.5" depth=".14" material="color: #080810; roughness: .9"></a-box>
  <a-box wall position="0 2.25  9"  width="22.3" height="4.5" depth=".14" material="color: #080810; roughness: .9"></a-box>
  <!-- 6 Pedestals arranged in arc -->
  <!-- gap1: METHOD — blue — position(-6, z=0) -->
  <a-entity id="p1" position="-6 0 0">
    <a-box width=".5" height="1.1" depth=".5" material="color: #0a0a18; roughness: .9"></a-box>
    <a-box width=".65" height=".06" depth=".65" position="0 .58 0" material="color: #101028; metalness: .4"></a-box>
    <a-box id="gap1" grabbable="physics:false; immovable:true;"
           position="0 .78 0" width=".3" height=".26" depth=".12"
           material="color: #2030c0; emissive: #1828a0; emissiveIntensity: .55"
           animation="property: material.emissiveIntensity; from: .38; to: .75; dur: 2200; easing: easeInOutSine; loop: true; dir: alternate"></a-box>
    <a-entity light="type: point; color: #2030c0; intensity: .4; distance: 3.5" position="0 1.8 0"></a-entity>
    <a-text value="METHOD" position="0 -.02 .36" rotation="0 0 0" text="color: #1828a0; width: 1.4; align: center; font: monoid"></a-text>
  </a-entity>
  <!-- gap2: APPLICATION — green — position(-3, z=-3) -->
  <a-entity id="p2" position="-3 0 -3">
    <a-box width=".5" height="1.1" depth=".5" material="color: #0a180a; roughness: .9"></a-box>
    <a-box width=".65" height=".06" depth=".65" position="0 .58 0" material="color: #102810; metalness: .4"></a-box>
    <a-box id="gap2" grabbable="physics:false; immovable:true;"
           position="0 .78 0" width=".3" height=".26" depth=".12"
           material="color: #20a030; emissive: #188028; emissiveIntensity: .55"
           animation="property: material.emissiveIntensity; from: .38; to: .75; dur: 1900; easing: easeInOutSine; loop: true; dir: alternate"></a-box>
    <a-entity light="type: point; color: #20a030; intensity: .4; distance: 3.5" position="0 1.8 0"></a-entity>
    <a-text value="APPLICATION" position="0 -.02 .36" rotation="0 0 0" text="color: #188028; width: 1.4; align: center; font: monoid"></a-text>
  </a-entity>
  <!-- gap3: KNOWLEDGE — yellow — position(0, z=-5) -->
  <a-entity id="p3" position="0 0 -5">
    <a-box width=".5" height="1.1" depth=".5" material="color: #181408; roughness: .9"></a-box>
    <a-box width=".65" height=".06" depth=".65" position="0 .58 0" material="color: #282008; metalness: .4"></a-box>
    <a-box id="gap3" grabbable="physics:false; immovable:true;"
           position="0 .78 0" width=".3" height=".26" depth=".12"
           material="color: #c0a010; emissive: #a08808; emissiveIntensity: .55"
           animation="property: material.emissiveIntensity; from: .38; to: .75; dur: 2600; easing: easeInOutSine; loop: true; dir: alternate"></a-box>
    <a-entity light="type: point; color: #c0a010; intensity: .4; distance: 3.5" position="0 1.8 0"></a-entity>
    <a-text value="KNOWLEDGE" position="0 -.02 .36" rotation="0 0 0" text="color: #a08808; width: 1.4; align: center; font: monoid"></a-text>
  </a-entity>
  <!-- gap4: SCALE — orange — position(3, z=-3) -->
  <a-entity id="p4" position="3 0 -3">
    <a-box width=".5" height="1.1" depth=".5" material="color: #181008; roughness: .9"></a-box>
    <a-box width=".65" height=".06" depth=".65" position="0 .58 0" material="color: #281808; metalness: .4"></a-box>
    <a-box id="gap4" grabbable="physics:false; immovable:true;"
           position="0 .78 0" width=".3" height=".26" depth=".12"
           material="color: #c05010; emissive: #a03808; emissiveIntensity: .55"
           animation="property: material.emissiveIntensity; from: .38; to: .75; dur: 2050; easing: easeInOutSine; loop: true; dir: alternate"></a-box>
    <a-entity light="type: point; color: #c05010; intensity: .4; distance: 3.5" position="0 1.8 0"></a-entity>
    <a-text value="SCALE" position="0 -.02 .36" rotation="0 0 0" text="color: #a03808; width: 1.4; align: center; font: monoid"></a-text>
  </a-entity>
  <!-- gap5: CRITICAL — pink — position(6, z=0) -->
  <a-entity id="p5" position="6 0 0">
    <a-box width=".5" height="1.1" depth=".5" material="color: #18080e; roughness: .9"></a-box>
    <a-box width=".65" height=".06" depth=".65" position="0 .58 0" material="color: #280818; metalness: .4"></a-box>
    <a-box id="gap5" grabbable="physics:false; immovable:true;"
           position="0 .78 0" width=".3" height=".26" depth=".12"
           material="color: #c03080; emissive: #a02068; emissiveIntensity: .55"
           animation="property: material.emissiveIntensity; from: .38; to: .75; dur: 2400; easing: easeInOutSine; loop: true; dir: alternate"></a-box>
    <a-entity light="type: point; color: #c03080; intensity: .4; distance: 3.5" position="0 1.8 0"></a-entity>
    <a-text value="CRITICAL" position="0 -.02 .36" rotation="0 0 0" text="color: #a02068; width: 1.4; align: center; font: monoid"></a-text>
  </a-entity>
  <!-- gap6: AUDIENCE — purple — position(0, z=3) -->
  <a-entity id="p6" position="0 0 3">
    <a-box width=".5" height="1.1" depth=".5" material="color: #100a18; roughness: .9"></a-box>
    <a-box width=".65" height=".06" depth=".65" position="0 .58 0" material="color: #181028; metalness: .4"></a-box>
    <a-box id="gap6" grabbable="physics:false; immovable:true;"
           position="0 .78 0" width=".3" height=".26" depth=".12"
           material="color: #7030c0; emissive: #5820a0; emissiveIntensity: .55"
           animation="property: material.emissiveIntensity; from: .38; to: .75; dur: 1750; easing: easeInOutSine; loop: true; dir: alternate"></a-box>
    <a-entity light="type: point; color: #7030c0; intensity: .4; distance: 3.5" position="0 1.8 0"></a-entity>
    <a-text value="AUDIENCE" position="0 -.02 .36" rotation="0 0 0" text="color: #5820a0; width: 1.4; align: center; font: monoid"></a-text>
  </a-entity>
</a-scene>
<script>
var examined = 0;
var total = 6;
var msgs = {
  gap1: ['Method Gap', 'Nobody has tried to do this using this technique. An existing problem, with existing approaches — but yours is new. Method gaps are about process: the question exists, but your method is untested.'],
  gap2: ['Application Gap', 'The method exists, but hasn\'t been applied here. Maybe it\'s been used in medicine but not music. Maybe in industry but not art. You\'re not inventing the technique — you\'re extending where it operates.'],
  gap3: ['Knowledge Gap', 'We simply don\'t know. Nobody has studied this. This is the foundational gap — it drives curiosity-led research. The question hasn\'t been asked, or asked properly. Your project asks it.'],
  gap4: ['Scale Gap', 'This has only been done at lab scale, or in one culture, or with 20 participants. What happens at a different scale? More users? Different context? The same question, but the scale changes the answer.'],
  gap5: ['Critical Gap', 'Everyone assumes this works, or is good, or is neutral. Your project questions the assumption itself. This is the most uncomfortable kind of gap — it challenges the foundations of a field, not just one finding.'],
  gap6: ['Audience Gap', 'This exists for experts. What about everyone else? Or vice versa. The gap is in who the work speaks to, or who the technology serves. You\'re not building something new — you\'re building for someone new.']
};
function updateCounter() {
  var el = document.getElementById('counter');
  el.textContent = 'Absences examined: ' + examined + ' / ' + total;
  el.classList.add('lit');
}
function showMsg(s, t) {
  document.getElementById('spk').textContent = s;
  document.getElementById('txt').textContent = t;
  document.getElementById('msg').classList.add('show');
}
function closeMsg() {
  document.getElementById('msg').classList.remove('show');
  if (examined >= total) showDecision();
}
function showDecision() {
  document.getElementById('dq').textContent = 'A student is building a system that combines diffusion models with live audio to generate real-time musical accompaniment. What type of research gap does this most likely address?';
  var opts = document.getElementById('dopts');
  opts.innerHTML = '';
  var cs = [
    {t: 'A knowledge gap — we don\'t know whether diffusion models can process audio.', c: false},
    {t: 'A method gap — diffusion models exist, live audio exists, but their combination in real-time musical generation hasn\'t been explored.', c: true},
    {t: 'An audience gap — this technology hasn\'t been made accessible to general users.', c: false},
    {t: 'A scale gap — this has been done in studios, but not in live performance contexts.', c: false}
  ];
  cs.forEach(function(o) {
    var b = document.createElement('button');
    b.textContent = o.t;
    if (o.c) b.dataset.correct = 'true';
    b.onclick = function() {
      var all = opts.querySelectorAll('button');
      all.forEach(function(x) { x.style.pointerEvents = 'none'; });
      b.classList.add(o.c ? 'cor' : 'wrg');
      if (!o.c) all.forEach(function(x) { if (x.dataset.correct) x.classList.add('cor'); });
      var fb = document.getElementById('dfb');
      fb.textContent = o.c
        ? 'Correct. Both components exist. The gap is in their combination and application. The method — diffusion-based real-time accompaniment — hasn\'t been tested. That\'s a method gap.'
        : 'Not quite. The key is that both elements (diffusion models, live audio) already exist in the literature. The gap is their specific combination in real-time. That\'s a method gap — the question isn\'t about knowledge or audience, but about untried technique.';
      fb.classList.add('show');
      setTimeout(function() {
        document.getElementById('dec').classList.remove('show');
        document.getElementById('exit').classList.add('show');
      }, 4500);
    };
    opts.appendChild(b);
  });
  document.getElementById('dec').classList.add('show');
}
Object.keys(msgs).forEach(function(id) {
  document.getElementById(id).addEventListener('grab', function(e) {
    if (this.dataset.done) { e.detail.grabbing.components.grabbing.drop(); return; }
    this.dataset.done = '1';
    e.detail.grabbing.components.grabbing.drop();
    examined++;
    updateCounter();
    showMsg(msgs[id][0], msgs[id][1]);
  });
});
</script>
</body>
</html>
