<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Room 7 — The Divided Room</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    #msgbox {
      position: fixed; bottom: 0; left: 0; width: 100%; z-index: 100;
      background: rgba(5,5,5,0.94); border-top: 1px solid #333;
      padding: 24px 32px; box-sizing: border-box;
      font-family: 'Courier New', monospace; color: #b0b0b0;
      display: none; max-height: 45vh; overflow-y: auto;
    }
    #msgbox.show { display: block; }
    #msgbox .speaker { font-size: 0.65rem; letter-spacing: 0.2em; color: #707070; text-transform: uppercase; margin-bottom: 8px; }
    #msgbox .text { font-size: 0.85rem; line-height: 1.8; }
    #msgbox .dismiss { font-size: 0.65rem; color: #505050; margin-top: 12px; letter-spacing: 0.15em; cursor: pointer; }
    #msgbox .dismiss:hover { color: #b0b0b0; }

    #door-prompt {
      position: fixed; top: 20px; right: 20px; z-index: 100;
      font-family: 'Courier New', monospace; display: none;
    }
    #door-prompt.show { display: block; }
    #door-prompt a {
      color: #808080; font-size: 0.75rem; letter-spacing: 0.15em;
      text-decoration: none; border: 1px solid #333; padding: 10px 20px;
      transition: all 0.3s;
    }
    #door-prompt a:hover { color: #c0c0c0; border-color: #808080; }

    #riddle-box {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 200; background: rgba(5,5,5,0.96); border: 1px solid #333;
      padding: 32px; max-width: 580px; width: 90%;
      font-family: 'Courier New', monospace; color: #b0b0b0; display: none;
    }
    #riddle-box.show { display: block; }
    #riddle-box .q { font-size: 0.9rem; line-height: 1.8; margin-bottom: 1.5em; }
    #riddle-box button {
      display: block; width: 100%; text-align: left; padding: 12px 16px;
      background: transparent; border: 1px solid #333; color: #b0b0b0;
      font-family: 'Courier New', monospace; font-size: 0.8rem; margin-bottom: 8px;
      cursor: pointer; transition: all 0.3s; line-height: 1.5;
    }
    #riddle-box button:hover { border-color: #808080; background: #0a0a0a; }
    #riddle-box button.correct { border-color: #508050; color: #80c080; }
    #riddle-box button.wrong { border-color: #805050; color: #c08080; }
    #riddle-box .feedback { font-size: 0.8rem; line-height: 1.7; color: #808080; margin-top: 1em; display: none; }
    #riddle-box .feedback.show { display: block; }
  </style>
</head>
<body>

<div id="msgbox">
  <div class="speaker" id="msg-speaker"></div>
  <div class="text" id="msg-text"></div>
  <div class="dismiss" onclick="closeMsg()">[ continue ]</div>
</div>

<div id="riddle-box">
  <div class="q" id="riddle-q"></div>
  <div id="riddle-opts"></div>
  <div class="feedback" id="riddle-fb"></div>
</div>

<div id="door-prompt">
  <a href="room8.html">Step outside →</a>
</div>

<a-scene fog="type: exponential; color: #050505; density: 0.035">
  <a-sky color="#050505"></a-sky>
  <a-entity light="type: ambient; color: #1a1a1a; intensity: 0.3"></a-entity>

  <!-- Camera — at the dividing line -->
  <a-entity position="0 1.6 4">
    <a-entity camera look-controls wasd-controls="acceleration: 20">
      <a-entity cursor="fuse: false"
                position="0 0 -1"
                geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.018"
                material="color: #a0a0a0; shader: flat; opacity: 0.5"
                raycaster="objects: .clickable; far: 15"></a-entity>
    </a-entity>
  </a-entity>

  <!-- Floor — split -->
  <a-plane position="-3 0 0" rotation="-90 0 0" width="6" height="12"
           material="color: #0a0a14; roughness: 0.8"></a-plane>
  <a-plane position="3 0 0" rotation="-90 0 0" width="6" height="12"
           material="color: #140a0a; roughness: 0.8"></a-plane>

  <!-- Dividing line on floor -->
  <a-plane position="0 0.005 0" rotation="-90 0 0" width="0.05" height="12"
           material="color: #c0c0c0; emissive: #808080; emissiveIntensity: 0.3"></a-plane>

  <!-- Ceiling -->
  <a-plane position="0 4 0" rotation="90 0 0" width="12" height="12"
           material="color: #030303"></a-plane>

  <!-- Walls -->
  <a-box position="-6 2 0" width="0.1" height="4" depth="12" material="color: #0a0a14"></a-box>
  <a-box position="6 2 0" width="0.1" height="4" depth="12" material="color: #140a0a"></a-box>
  <a-box position="0 2 -6" width="12" height="4" depth="0.1" material="color: #0a0a0a"></a-box>
  <a-box position="0 2 6" width="12" height="4" depth="0.1" material="color: #0a0a0a"></a-box>

  <!-- LEFT SIDE: Technical context (blue-ish) -->
  <a-text value="TECHNICAL\nCONTEXT" position="-3 3 -5.8"
          text="color: #3040a0; width: 4; align: center; font: monoid"></a-text>
  <a-entity light="type: point; color: #3040a0; intensity: 0.4; distance: 5" position="-3 3.5 -3"></a-entity>

  <!-- Technical objects — screens/terminals -->
  <a-entity position="-3.5 0 -2">
    <a-box width="1" height="0.7" depth="0.08" position="0 1.2 0" material="color: #1a1a30; emissive: #101030; emissiveIntensity: 0.3"></a-box>
    <a-box width="0.8" height="0.5" depth="0.06" position="0 1.2 0.04" material="color: #0a0a20; emissive: #2030a0; emissiveIntensity: 0.1"></a-box>
    <a-box class="clickable" id="tech1" width="1" height="0.8" depth="0.2" position="0 1.2 0"
           material="opacity: 0; transparent: true"></a-box>
    <a-text value="?" position="0 1.8 0.1" text="color: #3040a0; width: 1; align: center; font: monoid"></a-text>
  </a-entity>

  <a-entity position="-2 0 0">
    <a-box width="0.8" height="0.6" depth="0.06" position="0 1 0" material="color: #1a1a30; emissive: #101030; emissiveIntensity: 0.2"></a-box>
    <a-box class="clickable" id="tech2" width="0.8" height="0.7" depth="0.2" position="0 1 0"
           material="opacity: 0; transparent: true"></a-box>
    <a-text value="?" position="0 1.5 0.1" text="color: #3040a0; width: 1; align: center; font: monoid"></a-text>
  </a-entity>

  <!-- RIGHT SIDE: Artistic/Critical context (red-ish) -->
  <a-text value="ARTISTIC\nCONTEXT" position="3 3 -5.8"
          text="color: #a03040; width: 4; align: center; font: monoid"></a-text>
  <a-entity light="type: point; color: #a03040; intensity: 0.4; distance: 5" position="3 3.5 -3"></a-entity>

  <!-- Artistic objects — canvases/frames -->
  <a-entity position="3.5 0 -2">
    <a-plane width="1" height="0.8" position="0 1.5 0" material="color: #301015; roughness: 0.8"></a-plane>
    <a-box class="clickable" id="art1" width="1" height="0.8" depth="0.15" position="0 1.5 0.05"
           material="opacity: 0; transparent: true"></a-box>
    <a-text value="?" position="0 2.1 0.1" text="color: #a03040; width: 1; align: center; font: monoid"></a-text>
    <a-entity light="type: spot; color: #a03040; intensity: 0.3; angle: 25; distance: 3" position="0 2.5 0.5" rotation="-60 0 0"></a-entity>
  </a-entity>

  <a-entity position="2 0 0">
    <a-plane width="0.8" height="0.6" position="0 1.2 0" material="color: #301015; roughness: 0.8"></a-plane>
    <a-box class="clickable" id="art2" width="0.8" height="0.7" depth="0.15" position="0 1.2 0.05"
           material="opacity: 0; transparent: true"></a-box>
    <a-text value="?" position="0 1.7 0.1" text="color: #a03040; width: 1; align: center; font: monoid"></a-text>
  </a-entity>

  <!-- CENTRE: The intersection object — where both meet -->
  <a-entity position="0 0 -3">
    <a-sphere radius="0.3" position="0 1.2 0"
              material="color: #808080; emissive: #404040; emissiveIntensity: 0.3; metalness: 0.5; roughness: 0.3"
              animation="property: rotation; to: 0 360 0; dur: 15000; easing: linear; loop: true"></a-sphere>
    <a-box class="clickable" id="intersection" width="0.7" height="0.7" depth="0.7" position="0 1.2 0"
           material="opacity: 0; transparent: true"></a-box>
    <a-text value="THE\nINTERSECTION" position="0 1.9 0" text="color: #808080; width: 2; align: center; font: monoid"></a-text>
    <!-- Mixed light -->
    <a-entity light="type: point; color: #8040a0; intensity: 0.3; distance: 3" position="0 1.5 0"></a-entity>
  </a-entity>

</a-scene>

<script>
var found = 0;
var objData = {
  tech1: { speaker: 'Technical Context', text: 'What tools, methods, architectures, or materials exist? What are their capabilities and limitations? This is one half of the picture. You need to know what the machines can do — and where they fail.' },
  tech2: { speaker: 'Technical Context', text: 'In creative computing, the technical literature includes machine learning, computer graphics, HCI, signal processing, and more. These have their own conferences, their own vocabularies, their own standards of evidence.' },
  art1: { speaker: 'Artistic Context', text: 'What has been made? What aesthetic, conceptual, or critical territory has been explored? What hasn\'t? This is the other half. You need to know what the artists and thinkers have done — and what remains unexamined.' },
  art2: { speaker: 'Artistic Context', text: 'The artistic lineage might include generative art, sound art, net art, expanded cinema, speculative design. Major artworks often precede papers. Check festival archives, not just journals.' },
  intersection: { speaker: 'The Intersection', text: 'Your gap often sits right here — at the intersection. A technical capability that hasn\'t been explored artistically. An artistic ambition that hasn\'t been enabled technically. The most productive gaps live where these two contexts fail to meet.' }
};

function showMsg(speaker, text) {
  document.getElementById('msg-speaker').textContent = speaker;
  document.getElementById('msg-text').textContent = text;
  document.getElementById('msgbox').classList.add('show');
}

function closeMsg() {
  document.getElementById('msgbox').classList.remove('show');
  if (found >= 5) showRiddle();
}

Object.keys(objData).forEach(function(id) {
  document.getElementById(id).addEventListener('click', function() {
    if (this.dataset.done) return; this.dataset.done = '1';
    found++;
    var d = objData[id];
    showMsg(d.speaker, d.text);
  });
});

function showRiddle() {
  var box = document.getElementById('riddle-box');
  document.getElementById('riddle-q').textContent = 'Most neural audio synthesis work assumes the output should sound "realistic." This assumption is widespread but rarely questioned. What kind of gap does challenging it open?';

  var opts = document.getElementById('riddle-opts');
  opts.innerHTML = '';
  var choices = [
    { text: 'A method gap — we need a new technique.', correct: false },
    { text: 'A critical gap — an unexamined assumption hiding in plain sight.', correct: true },
    { text: 'An application gap — the tech needs a new domain.', correct: false }
  ];

  choices.forEach(function(c) {
    var btn = document.createElement('button');
    btn.textContent = c.text;
    btn.onclick = function() {
      var all = opts.querySelectorAll('button');
      all.forEach(function(b) { b.style.pointerEvents = 'none'; });
      if (c.correct) {
        btn.classList.add('correct');
        document.getElementById('riddle-fb').textContent = 'Yes. An orthodoxy — an assumption so widespread it becomes invisible. Challenging it is where entire new research directions begin. The edge is closer than you think.';
      } else {
        btn.classList.add('wrong');
        choices.forEach(function(ch, i) { if (ch.correct) all[i].classList.add('correct'); });
        document.getElementById('riddle-fb').textContent = 'This is a critical gap. "Realism" as the default goal is an assumption nobody questions — a hidden orthodoxy. Interrogating it opens a frontier.';
      }
      document.getElementById('riddle-fb').classList.add('show');
      setTimeout(function() {
        box.classList.remove('show');
        document.getElementById('door-prompt').classList.add('show');
      }, 4000);
    };
    opts.appendChild(btn);
  });

  box.classList.add('show');
}
</script>
</body>
</html>
