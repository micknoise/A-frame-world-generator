<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>The Edge — Room 7: The Divided Room</title>
<script src="../libs/aframe/aframe-v1.3.0.min.js"></script>
<script>if(window.AFRAME&&AFRAME.components&&AFRAME.components.grabbable)delete AFRAME.components.grabbable;</script>
<script src="../libs/a-game/a-game.min.js"></script>
<style>
body{margin:0;overflow:hidden}
#msg{position:fixed;bottom:0;left:0;width:100%;z-index:100;background:rgba(4,4,8,.96);border-top:1px solid #282848;padding:28px 44px;box-sizing:border-box;font-family:'Courier New',monospace;opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .3s ease,transform .3s ease;max-height:48vh;overflow-y:auto}
#msg.show{opacity:1;pointer-events:auto;transform:none}
#msg .spk{font-size:.52rem;letter-spacing:.38em;color:#585898;text-transform:uppercase;margin-bottom:14px}
#msg .txt{font-size:.88rem;line-height:2.15;color:#b0b0e0;max-width:700px}
#msg .dis{font-size:.52rem;color:#282848;margin-top:18px;letter-spacing:.28em;cursor:pointer;text-transform:uppercase;display:inline-block;border:1px solid #202040;padding:7px 18px;transition:color .2s,border-color .2s}
#msg .dis:hover{color:#b0b0e0;border-color:#585898}
#dec{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:200;background:rgba(4,4,8,.97);border:1px solid #282848;padding:36px;max-width:580px;width:92%;font-family:'Courier New',monospace;opacity:0;pointer-events:none;transition:opacity .3s ease}
#dec.show{opacity:1;pointer-events:auto}
#dec .q{font-size:.86rem;line-height:2;color:#b0b0e0;margin-bottom:1.6em}
#dec button{display:block;width:100%;text-align:left;padding:12px 16px;background:transparent;border:1px solid #282848;color:#b0b0e0;font-family:'Courier New',monospace;font-size:.76rem;margin-bottom:8px;cursor:pointer;transition:border-color .2s;line-height:1.65}
#dec button:hover{border-color:#585898}
#dec button.cor{border-color:#508050;color:#80c080}
#dec button.wrg{border-color:#805050;color:#c08080}
#dec .fb{font-size:.76rem;line-height:1.85;color:#585898;margin-top:1.1em;display:none}
#dec .fb.show{display:block}
#divlabel{position:fixed;top:50%;left:22px;transform:translateY(-50%);z-index:50;font-family:'Courier New',monospace;font-size:.52rem;letter-spacing:.32em;color:#1a1a38;text-transform:uppercase;writing-mode:vertical-lr;pointer-events:none}
#exit{position:fixed;top:22px;right:22px;z-index:100;font-family:'Courier New',monospace;opacity:0;pointer-events:none;transition:opacity .5s ease}
#exit.show{opacity:1;pointer-events:auto}
#exit a{color:#585898;font-size:.6rem;letter-spacing:.28em;text-transform:uppercase;text-decoration:none;border:1px solid #282848;padding:10px 22px;display:block;transition:all .3s}
#exit a:hover{color:#b0b0e0;border-color:#585898}
</style>
</head>
<body>
<input type="checkbox" id="save-position-from-vr" hidden aria-hidden="true">
<div id="divlabel">Technical &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Artistic</div>
<div id="msg">
  <div class="spk" id="spk"></div>
  <div class="txt" id="txt"></div>
  <div class="dis" onclick="closeMsg()">[ continue ]</div>
</div>
<div id="dec">
  <div class="q" id="dq"></div>
  <div id="dopts"></div>
  <div class="fb" id="dfb"></div>
</div>
<div id="exit"><a href="room8.html">Step outside &#8594;</a></div>
<a-scene physics="workerUrl: ../libs/a-game/cannonWorker.min.js; gravity: 0 -9.8 0"
         fog="type: exponential; color: #040408; density: 0.032" loading-screen="enabled: false">
  <a-player id="player" locomotion grabbing position="0 0 4"></a-player>
  <a-sky color="#030306"></a-sky>
  <a-entity light="type: ambient; color: #101018; intensity: 0.25"></a-entity>
  <!-- Blue left side (technical) -->
  <a-entity light="type: point; color: #202060; intensity: .35; distance: 7" position="-4 3.5 0"
            animation="property: light.intensity; from: .25; to: .45; dur: 3200; easing: easeInOutSine; loop: true; dir: alternate"></a-entity>
  <a-entity light="type: point; color: #1818a0; intensity: .2; distance: 5" position="-6 2.5 -3"></a-entity>
  <!-- Red right side (artistic) -->
  <a-entity light="type: point; color: #600808; intensity: .35; distance: 7" position=" 4 3.5 0"
            animation="property: light.intensity; from: .25; to: .45; dur: 2800; easing: easeInOutSine; loop: true; dir: alternate"></a-entity>
  <a-entity light="type: point; color: #a01010; intensity: .2; distance: 5" position=" 6 2.5 -3"></a-entity>
  <!-- Center dividing light -->
  <a-entity light="type: point; color: #484860; intensity: .3; distance: 4" position="0 3.5 -3"></a-entity>
  <!-- Floor -->
  <a-box floor position="0 -0.05 0" width="14" height="0.1" depth="12" material="color: #060608; roughness: .9"></a-box>
  <!-- Floor colour split: left blue tint, right red tint -->
  <a-box position="-3.5 .003 0" width="7" height=".002" depth="12" material="color: #080818; roughness: .95; opacity: .8"></a-box>
  <a-box position=" 3.5 .003 0" width="7" height=".002" depth="12" material="color: #180808; roughness: .95; opacity: .8"></a-box>
  <!-- Ceiling -->
  <a-plane position="0 4 0" rotation="90 0 0" width="14" height="12" material="color: #040406"></a-plane>
  <!-- Walls -->
  <a-box wall position="-7 2 0"  width=".14" height="4" depth="12.3" material="color: #0a0a18; roughness: .9"></a-box>
  <a-box wall position=" 7 2 0"  width=".14" height="4" depth="12.3" material="color: #18080a; roughness: .9"></a-box>
  <a-box wall position="0 2 -6"  width="14.3" height="4" depth=".14" material="color: #0a0a10; roughness: .9"></a-box>
  <a-box wall position="0 2  6"  width="14.3" height="4" depth=".14" material="color: #0a0a10; roughness: .9"></a-box>
  <!-- Dividing line on floor -->
  <a-box position="0 .008 0" width=".04" height=".02" depth="12" material="color: #383858; roughness: .5; opacity: .6"></a-box>
  <!-- Wall label left (TECHNICAL) -->
  <a-text value="TECHNICAL" position="-5.5 3.2 -5.9" text="color: #181840; width: 3; align: center; font: monoid"></a-text>
  <!-- Wall label right (ARTISTIC) -->
  <a-text value="ARTISTIC"  position=" 5.5 3.2 -5.9" text="color: #401818; width: 3; align: center; font: monoid"></a-text>
  <!-- TECH OBJECT 1 — left (circuit board slab) -->
  <a-entity id="to1" position="-4 0 -1">
    <a-box width="1" height=".65" depth=".8" material="color: #0a0a18; roughness: .8"></a-box>
    <a-box id="tech1" grabbable="physics:false; immovable:true;"
           position="0 .42 0" width=".5" height=".12" depth=".35"
           material="color: #1828a0; emissive: #1020a0; emissiveIntensity: .6"
           animation="property: material.emissiveIntensity; from: .4; to: .8; dur: 1800; easing: easeInOutSine; loop: true; dir: alternate"></a-box>
    <a-text id="tlbl1" value="EXAMINE" position="0 1.15 .08" text="color: #181840; width: 2.2; align: center; font: monoid"
            animation="property: position; from: 0 1.11 .08; to: 0 1.19 .08; dur: 1900; easing: easeInOutSine; loop: true; dir: alternate"></a-text>
    <a-entity light="type: point; color: #2030c0; intensity: .25; distance: 3" position="0 1.2 0"></a-entity>
  </a-entity>
  <!-- TECH OBJECT 2 — left far (terminal) -->
  <a-entity id="to2" position="-4 0 -4">
    <a-box width=".85" height=".7" depth=".65" material="color: #0c0c1a; roughness: .8"></a-box>
    <a-box id="tech2" grabbable="physics:false; immovable:true;"
           position="0 .46 0" width=".55" height=".1" depth=".4"
           material="color: #2040c0; emissive: #1830a0; emissiveIntensity: .55"
           animation="property: material.emissiveIntensity; from: .35; to: .75; dur: 2300; easing: easeInOutSine; loop: true; dir: alternate"></a-box>
    <a-text id="tlbl2" value="EXAMINE" position="0 1.15 .08" text="color: #181840; width: 2.2; align: center; font: monoid"
            animation="property: position; from: 0 1.11 .08; to: 0 1.19 .08; dur: 2150; easing: easeInOutSine; loop: true; dir: alternate"></a-text>
    <a-entity light="type: point; color: #2030c0; intensity: .22; distance: 3" position="0 1.2 0"></a-entity>
  </a-entity>
  <!-- ART OBJECT 1 — right (canvas frame) -->
  <a-entity id="ao1" position="4 0 -1">
    <a-box width="1" height=".65" depth=".8" material="color: #180a0a; roughness: .8"></a-box>
    <a-box id="art1" grabbable="physics:false; immovable:true;"
           position="0 .42 0" width=".5" height=".38" depth=".04"
           material="color: #c01820; emissive: #a01018; emissiveIntensity: .5"
           animation="property: material.emissiveIntensity; from: .35; to: .7; dur: 2100; easing: easeInOutSine; loop: true; dir: alternate"></a-box>
    <a-text id="albl1" value="EXAMINE" position="0 1.15 .08" text="color: #401818; width: 2.2; align: center; font: monoid"
            animation="property: position; from: 0 1.11 .08; to: 0 1.19 .08; dur: 1700; easing: easeInOutSine; loop: true; dir: alternate"></a-text>
    <a-entity light="type: point; color: #c01820; intensity: .25; distance: 3" position="0 1.2 0"></a-entity>
  </a-entity>
  <!-- ART OBJECT 2 — right far (score pages) -->
  <a-entity id="ao2" position="4 0 -4">
    <a-box width=".85" height=".7" depth=".65" material="color: #1a0c0c; roughness: .8"></a-box>
    <a-box id="art2" grabbable="physics:false; immovable:true;"
           position="0 .46 0" width=".5" height=".04" depth=".38"
           material="color: #c02010; emissive: #a01808; emissiveIntensity: .5"
           animation="property: material.emissiveIntensity; from: .3; to: .68; dur: 2700; easing: easeInOutSine; loop: true; dir: alternate"></a-box>
    <a-text id="albl2" value="EXAMINE" position="0 1.15 .08" text="color: #401818; width: 2.2; align: center; font: monoid"
            animation="property: position; from: 0 1.11 .08; to: 0 1.19 .08; dur: 2400; easing: easeInOutSine; loop: true; dir: alternate"></a-text>
    <a-entity light="type: point; color: #c01820; intensity: .22; distance: 3" position="0 1.2 0"></a-entity>
  </a-entity>
  <!-- INTERSECTION OBJECT — center (sphere on pedestal) -->
  <a-entity id="io" position="0 0 -3">
    <a-box width=".55" height="1.1" depth=".55" material="color: #101018; roughness: .9"></a-box>
    <a-sphere id="intersection" grabbable="physics:false; immovable:true;"
              position="0 .82 0" radius=".2"
              material="color: #a090e0; emissive: #6050c0; emissiveIntensity: .6"
              animation__rot="property: rotation; from: 0 0 0; to: 0 360 0; dur: 6000; easing: linear; loop: true"
              animation__em="property: material.emissiveIntensity; from: .4; to: .8; dur: 2500; easing: easeInOutSine; loop: true; dir: alternate"></a-sphere>
    <a-entity light="type: point; color: #8070d0; intensity: .45; distance: 4" position="0 1.8 0"></a-entity>
    <a-text id="ilbl" value="?" position="0 1.5 .08" text="color: #585898; width: 1.8; align: center; font: monoid"
            animation="property: position; from: 0 1.46 .08; to: 0 1.54 .08; dur: 2200; easing: easeInOutSine; loop: true; dir: alternate"></a-text>
  </a-entity>
</a-scene>
<script>
var touched = 0;
var total = 5;
var objData = {
  tech1: ['The Technical Side', 'Neural audio synthesis. Probabilistic models. Real-time signal processing. The technical literature has developed methods for generating, transforming, and controlling sound with extraordinary precision. The field knows how to do this. But knowing how to do it is not the same as knowing why to do it, or what it produces beyond accuracy metrics.'],
  tech2: ['The Technical Side', 'Diffusion models. Transformer architectures. Training datasets. Evaluation benchmarks. The technical community measures success in perceptual quality scores, in model efficiency, in generalisability. It rarely asks: what is this doing culturally? Who does it serve? What is at stake in these design decisions?'],
  art1: ['The Artistic Side', 'Improvisation. Presence. The ethics of machine participation. The artistic community has been grappling with these questions since the earliest days of computer music. They have developed rich frameworks for thinking about authorship, collaboration, and the aesthetics of interaction — but the tools they use are often left unanalysed.'],
  art2: ['The Artistic Side', 'Music as social practice. The politics of notation. Embodied knowledge that resists formalisation. The artistic literature offers perspectives the technical literature doesn\'t have words for. The gap between them is not just methodological — it\'s about what counts as evidence, what counts as a contribution, what counts as knowing.'],
  intersection: ['The Meeting Point', 'Projects in creative computing live here — in the middle. They are not fully technical (the machine\'s accuracy is not the point) and not fully artistic (the cultural dimension alone is not sufficient). The gap that drives these projects is often at the interface: what happens when technical capability meets artistic intention? That is where the interesting unknowns are.']
};
function showMsg(s, t) {
  document.getElementById('spk').textContent = s;
  document.getElementById('txt').textContent = t;
  document.getElementById('msg').classList.add('show');
}
function closeMsg() {
  document.getElementById('msg').classList.remove('show');
  if (touched >= total) showDecision();
}
function showDecision() {
  document.getElementById('dq').textContent = 'A researcher proposes that neural audio synthesis assumes audio can be divorced from performance context — and that this assumption limits the technology\'s value for live music. What kind of gap does this identify?';
  var opts = document.getElementById('dopts');
  opts.innerHTML = '';
  var cs = [
    {t: 'A knowledge gap — we don\'t know whether neural audio synthesis works in real-time.', c: false},
    {t: 'A critical gap — it challenges an embedded assumption in how the technical literature defines what good audio generation means.', c: true},
    {t: 'An application gap — the technology hasn\'t been applied in live music contexts yet.', c: false},
    {t: 'A method gap — existing synthesis methods haven\'t been adapted for performance.', c: false}
  ];
  cs.forEach(function(o) {
    var b = document.createElement('button');
    b.textContent = o.t;
    if (o.c) b.dataset.correct = 'true';
    b.onclick = function() {
      var all = opts.querySelectorAll('button');
      all.forEach(function(x) { x.style.pointerEvents = 'none'; });
      b.classList.add(o.c ? 'cor' : 'wrg');
      if (!o.c) all.forEach(function(x) { if (x.dataset.correct) x.classList.add('cor'); });
      var fb = document.getElementById('dfb');
      fb.textContent = o.c
        ? 'Correct. The claim isn\'t just that it hasn\'t been done — it\'s that the field is working from a flawed assumption. Challenging the assumption, not just extending the method, is what makes this a critical gap.'
        : 'Not quite. The key phrase is "assumes audio can be divorced from context" — this is an embedded assumption being challenged, not an unexplored application or missing knowledge. Critical gaps question the foundations, not just the coverage, of a field.';
      fb.classList.add('show');
      setTimeout(function() {
        document.getElementById('dec').classList.remove('show');
        document.getElementById('exit').classList.add('show');
      }, 4500);
    };
    opts.appendChild(b);
  });
  document.getElementById('dec').classList.add('show');
}
var lblMap = {tech1: 'tlbl1', tech2: 'tlbl2', art1: 'albl1', art2: 'albl2', intersection: 'ilbl'};
Object.keys(objData).forEach(function(id) {
  document.getElementById(id).addEventListener('grab', function(e) {
    if (this.dataset.done) { e.detail.grabbing.components.grabbing.drop(); return; }
    this.dataset.done = '1';
    e.detail.grabbing.components.grabbing.drop();
    touched++;
    var lbl = document.getElementById(lblMap[id]);
    if (lbl) lbl.setAttribute('visible', 'false');
    showMsg(objData[id][0], objData[id][1]);
  });
});
</script>
</body>
</html>
